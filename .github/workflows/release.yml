name: Release CI

on:
  push:
    branches:
      - drm-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_on_windows:
    runs-on: windows-latest
    env:
      EVS_NO_ASK: "1"
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EVS client
        run: python -m pip install --upgrade pip castlabs-evs

      - run: npm ci

      - name: Build Windows app
        run: npm run build-win

      - name: VMP sign Windows package
        run: python -m castlabs_evs.vmp sign-pkg --persistent dist/win-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.msi
            dist/win-unpacked/**

  build_on_mac:
    runs-on: macos-latest
    env:
      EVS_NO_ASK: "1"
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EVS client
        run: python3 -m pip install --upgrade pip castlabs-evs

      - run: npm ci

      - name: Build macOS app
        run: npm run build-mac

      - name: VMP sign macOS package
        run: python3 -m castlabs_evs.vmp sign-pkg --persistent dist/mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/*.dmg
            dist/mac/**

  create_release:
    needs:
      - build_on_windows
      - build_on_mac
    if: always() && needs.build_on_windows.result == 'success' && needs.build_on_mac.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Get version from package.json
        id: version
        run: echo 'version='"$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/windows-builds/*.msi
            artifacts/mac-builds/*.dmg
